name: Publish content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate post data
        run: node scripts/generate_posts.mjs public/posts.js

      - name: Publish post data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          git fetch origin deploy --depth=1
          git worktree add --detach "$publish_dir" origin/deploy
          cp public/posts.js "$publish_dir/posts.js"
          rm -rf "$publish_dir/articles"
          cp -R public/articles "$publish_dir/articles"

          cd "$publish_dir"
          git checkout -B deploy
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.js articles

          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Deploy content"
            git push origin deploy
          fi
