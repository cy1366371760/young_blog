<p>看了柴静讲胡适和他儿子胡思杜的故事，感慨虎父无犬子。</p>
<p>一开始，觉得胡思杜选择留在中国有些盲目。后来，看到他能站出来说真心话，又有了不同的感受。报纸批判他继承胡适的衣钵，可从更长的历史尺度来看，我反而觉得，恰恰是这一点，证明了谁才是站在正确一边的人。</p>
<p>看完后，自己的另外几条感悟：</p>
<ul>
<li>一个地方没有不说话的自由，灾难也会接踵而至。</li>
<li>爱自由，应该胜于面包，胜于生命。</li>
<li>主张彻底改革的人，总是最后成为独裁者，因为不允许任何反对的声音。</li>
<li>应当反对一切不容批评、不容置疑的理论。</li>
</ul>
