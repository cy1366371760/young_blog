<p>和 mentor 說了下週末就轉上海，也提了想請他喫飯。感覺有些話出口前很糾結，但其實說了也挺自然，沒什麼大不了的。mentor 還和我聊了別的同事跳槽之類的八卦，說不定後續約飯也可以聊。</p>
