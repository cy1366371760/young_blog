<p>看了柴靜講胡適和他兒子胡思杜的故事，感慨虎父無犬子。</p>
<p>一開始，覺得胡思杜選擇留在中國有些盲目。後來，看到他能站出來說真心話，又有了不同的感受。報紙批判他繼承胡適的衣鉢，可從更長的歷史尺度來看，我反而覺得，恰恰是這一點，證明了誰纔是站在正確一邊的人。</p>
<p>看完後，自己的另外幾條感悟：</p>
<ul>
<li>一個地方沒有不說話的自由，災難也會接踵而至。</li>
<li>愛自由，應該勝於麪包，勝於生命。</li>
<li>主張徹底改革的人，總是最後成爲獨裁者，因爲不允許任何反對的聲音。</li>
<li>應當反對一切不容批評、不容置疑的理論。</li>
</ul>
